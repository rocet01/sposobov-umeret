   Вне VK (в адресе нет vk_app_id / vk_platform) — локальная версия: реклама «проигрывается» мгновенно.

  /* cb(cloud) — когда можно открывать меню; облако, пришедшее позже 4 с, отдаётся в onCloud */

      setTimeout(function () { readCloud().then(function (d) { cloudOk = true; fin(d); Y.flush(); }, function () { fin(null); }); }, 5000);

<title>1000 способов умереть</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15102a">
<style>
:root{--ink:#1d1533;--ink2:#2c2150;--paper:#fffaf0;--gold:#ffc83d;--gold2:#e09a12;--mint:#3ddc97;--mint2:#1fa36a;--red:#ff4a5a;--red2:#c22a3a;--blue:#4aa8ff;--txt:#fff;
  --f:"Trebuchet MS","Segoe UI","Nunito",Verdana,Arial,sans-serif;--fh:"Arial Black","Segoe UI Black",Impact,"Trebuchet MS",sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#15102a;color:var(--txt);font-family:var(--f);touch-action:none;overscroll-behavior:none}
#bgc{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{position:fixed;inset:0;pointer-events:none}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.18),rgba(0,0,0,0) 55%),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(5,0,20,.55))}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.scr{position:fixed;inset:0;display:none;pointer-events:none}
.scr.on{display:block}
.scr>*{pointer-events:auto}
button{font-family:var(--f);cursor:pointer;color:inherit}
.btn{position:relative;font:900 18px/1.1 var(--fh);letter-spacing:.3px;color:var(--ink);background:var(--paper);border:0;border-radius:16px;padding:12px 20px;
  box-shadow:0 5px 0 #b9ab90,0 8px 16px rgba(0,0,0,.35);transition:transform .07s,box-shadow .07s;outline:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9ab90,0 3px 8px rgba(0,0,0,.3)}
.btn small{display:block;font:700 12px var(--f);opacity:.75;margin-top:3px}
.btn.g{background:linear-gradient(#5af0ad,var(--mint));box-shadow:0 5px 0 var(--mint2),0 8px 18px rgba(0,0,0,.35)}
.btn.g:active{box-shadow:0 1px 0 var(--mint2)}
.btn.y{background:linear-gradient(#ffdb6e,var(--gold));box-shadow:0 5px 0 var(--gold2),0 8px 18px rgba(0,0,0,.35)}
.btn.y:active{box-shadow:0 1px 0 var(--gold2)}
.btn.r{background:linear-gradient(#ff7a86,var(--red));color:#fff;box-shadow:0 5px 0 var(--red2),0 8px 18px rgba(0,0,0,.35)}
.btn.p{background:linear-gradient(#b48aff,#8a5aff);color:#fff;box-shadow:0 5px 0 #5a32c0,0 8px 18px rgba(0,0,0,.35)}
.btn.big{font-size:30px;padding:18px 28px;border-radius:22px;white-space:nowrap}
.btn.ic{width:48px;height:48px;padding:0;font-size:20px;border-radius:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sq{width:96px;height:86px;padding:8px 4px;font-size:30px;border-radius:18px}
.row{display:flex;gap:12px;justify-content:center}

/* загрузка и меню */
#loading{background:#15102a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:30px;pointer-events:auto}
#loading.on{display:flex}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.logo{text-align:center;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.logo span{display:block;font:900 clamp(70px,17vw,150px)/.85 var(--fh);color:var(--gold);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--red),0 10px 0 var(--ink);letter-spacing:-2px}
.logo b{display:block;font:900 clamp(22px,5.5vw,44px)/1 var(--fh);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin-top:10px}
.logo i{display:block;font:700 clamp(14px,3.4vw,19px) var(--f);color:#fff;margin-top:12px;text-shadow:0 2px 4px rgba(0,0,0,.6);font-style:normal}
.logo.small span{font-size:80px}.logo.small b{font-size:24px}
#menu .logo{position:absolute;left:0;right:0;top:calc(max(4vh, 56px) + var(--st));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
.mcol{position:absolute;left:50%;bottom:calc(5vh + var(--sb));transform:translateX(-50%);display:flex;flex-direction:column;gap:14px;align-items:stretch;width:min(340px,86vw)}
.mset{position:absolute;left:12px;top:calc(10px + var(--st))}
.mstat{position:absolute;right:12px;top:calc(10px + var(--st));font:800 15px var(--f);background:rgba(20,10,40,.55);padding:8px 14px;border-radius:14px}
@media (min-aspect-ratio:4/3){
  #menu .logo{top:calc(2.5vh + var(--st))}
  #menu .logo span{font-size:min(15vh,120px)}
  #menu .logo b{font-size:min(5.4vh,40px);margin-top:1vh}
  #menu .logo i{font-size:min(2.8vh,18px);margin-top:1vh}
  .mcol{flex-direction:row;align-items:center;width:auto;bottom:calc(3.5vh + var(--sb));gap:12px}
  .mcol .btn.big{font-size:min(4.4vh,30px);padding:min(2.2vh,18px) 28px}
  .mcol>.btn:not(.big){height:min(12vh,86px);padding:0 18px}
  .mcol .btn.sq{width:min(13vh,96px);height:min(12vh,86px);font-size:min(4.4vh,30px)}
}

/* верхняя панель */
.top{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--st)) 12px 10px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(20,10,40,.85),rgba(20,10,40,0))}
.top h2{flex:1;margin:0;font:900 26px var(--fh);text-shadow:0 3px 0 var(--ink)}
.coins{font:900 18px var(--fh);background:rgba(20,10,40,.7);border:3px solid var(--gold);color:var(--gold);border-radius:20px;padding:5px 14px 5px 10px;display:flex;align-items:center;gap:6px;pointer-events:none}
.coins::before{content:"";width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#ffc83d 50%,#c98a10);box-shadow:0 2px 0 #8a5a00}

/* миры */
#worlds{background:rgba(15,8,32,.55)}
.wgrid{position:absolute;inset:0;top:calc(72px + var(--st));overflow:auto;padding:10px 14px calc(30px + var(--sb));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;touch-action:pan-y}
.wc{position:relative;border-radius:20px;padding:14px 12px 12px;min-height:150px;border:0;text-align:left;color:#fff;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 20px rgba(0,0,0,.3)}
.wc:active{transform:translateY(3px)}
.wc .n{font:900 34px var(--fh);opacity:.35;position:absolute;right:10px;top:4px}
.wc b{display:block;font:900 19px/1.1 var(--fh);text-shadow:0 2px 0 rgba(0,0,0,.5);margin-top:44px}
.wc .p{font:700 13px var(--f);margin-top:6px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.wc .bar{height:9px;border-radius:5px;background:rgba(0,0,0,.35);margin-top:7px;overflow:hidden}.wc .bar i{display:block;height:100%;background:var(--gold)}
.wc.lock{filter:grayscale(.85) brightness(.6)}
.wc.lock::after{content:"🔒";position:absolute;left:12px;top:10px;font-size:28px}

.tabs{display:flex;gap:6px;justify-content:center}.tabs .btn{flex:1;font-size:14px;padding:8px 6px}.tabs .btn.on{background:linear-gradient(#5af0ad,var(--mint))}

.trk{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;text-align:left;box-shadow:inset 0 0 0 3px #eadfc6}

@media (max-width:520px){#hud .gems{display:none}}
/* завязка уровня и предупреждение о тупике */
.hgoal{pointer-events:auto;cursor:pointer}
.hidea{position:absolute;left:50%;width:max-content;max-width:min(560px,calc(100vw - 24px));box-sizing:border-box;margin:6px 0 0;font:700 14px/1.3 var(--f);color:#fff;background:rgba(20,10,40,.66);
  border-radius:12px;padding:5px 12px;text-shadow:0 1px 2px rgba(0,0,0,.7);opacity:0;transform:translate(-50%,-6px);transition:opacity .35s,transform .35s;pointer-events:none}

.hdead{display:none;align-self:flex-start;pointer-events:auto;border:2px solid var(--red);background:rgba(70,10,30,.88);color:#fff;font:800 14px var(--f);
  border-radius:12px;padding:6px 11px;animation:pulse 1.1s ease-in-out infinite}
.hdead.on{display:block}
.btn.pulse{animation:pulse 1s ease-in-out infinite;box-shadow:0 0 0 4px var(--red),0 5px 0 #b9ab90}
/* коллекция способов, «Бегом!» */
.row{gap:10px}.btn.sq{width:78px;height:82px;font-size:28px}
.way{background:linear-gradient(135deg,#2c2150,#4a2f7a);color:#fff;border-radius:14px;padding:10px 14px;text-align:left;box-shadow:inset 0 0 0 3px rgba(255,200,61,.55)}
.way small{display:block;font:800 11px var(--f);letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.way small i{font-style:normal;color:#7dffb8}
.way b{font:800 15px/1.35 var(--f)}
.way.sec{background:linear-gradient(135deg,#0f3a2c,#1f6a4a);box-shadow:inset 0 0 0 3px rgba(125,255,184,.6)}
.hrt{display:none!important;border:2px solid var(--gold);color:var(--gold)!important;animation:pulse 1s ease-in-out infinite}
.hrt.on{display:block!important}
.wtabs{display:flex;align-items:center;justify-content:space-between;gap:10px}.wtabs b{font:900 18px var(--fh)}
.wlist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;text-align:left;touch-action:pan-y}
.wi{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px}
.wi span{font:900 15px var(--fh);min-width:34px;color:var(--gold2)}
.wi p{flex:1;margin:0;font:600 13px/1.3 var(--f)}.wi p b{font-weight:800}
.wi em{font-style:normal;font-size:15px;white-space:nowrap}
.wi.off{opacity:.55}
.lb .nw,.lb .rtb{position:absolute;top:-6px;font-style:normal;font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.lb .nw{left:-4px}.lb .rtb{right:-4px}
/* узкие телефоны: крестовина и кнопки помельче, чтобы не налезали друг на друга */
@media (max-width:359px){#dpad{transform:scale(.84);transform-origin:0 100%}.hb{width:58px;height:58px;font-size:22px}.hb small{font-size:9px}.mstat{font-size:12.5px;padding:6px 9px}}
/* телефон в альбомной ориентации: логотип под верхней панелью, подписи кнопок не вылезают за кнопки */
@media (min-aspect-ratio:4/3) and (max-height:500px){

}

}

<script id="logicjs">
/* ============================================================
   1000 СПОСОБОВ УМЕРЕТЬ — правила игры (общие для игры и генератора)
   Пошаговая головоломка на сетке. Цель — умереть, мир мешает.
   ============================================================ */
(function (G) {
'use strict';
var DX = [0, 1, 0, -1, 0], DY = [-1, 0, 1, 0, 0]; // 0↑ 1→ 2↓ 3← 4 ждать
var VOID = 0, FLOOR = 1, WALL = 2, PUDDLE = 3, ICE = 4, RIVER = 5, CRACK = 6, ROAD = 7, BELT = 8, JUMP = 12; // 8..11 — лента ↑→↓←
var TCH = { ' ': 0, '.': 1, '#': 2, '~': 3, 'i': 4, 'w': 5, 'c': 6, 'r': 7, '0': 8, '1': 9, '2': 10, '3': 11, 'j': 12 };

function isBelt(t) { return t >= BELT && t <= BELT + 3; }

  function arr(v) { var a = new Int16Array(n); a.fill(v); return a; }
  C.leverAt = arr(-1); C.plateAt = arr(-1); C.gateAt = arr(-1); C.doorAt = arr(-1);
  C.pickAt = arr(-1); C.spikeAt = arr(-1); C.laserAt = arr(-1); C.killAt = arr(-1);
  C.poolAt = new Uint8Array(n); C.wireAt = new Uint8Array(n); C.teleAt = arr(-1);
  C.buttonAt = arr(-1); C.crackBit = arr(-1); C.riverBit = arr(-1); C.roadAt = new Uint8Array(n);
  C.mirAt = arr(-1); C.mirs = []; C.ghostMode = [];
  C.levers = []; C.plates = []; C.gates = []; C.doors = []; C.picks = []; C.spikes = [];
  C.lasers = []; C.kills = []; C.pools = []; C.wires = []; C.teles = []; C.drops = []; C.cars = [];
  var crates = [], guards = [], beasts = [], mirs = [], ghosts = [], start = 0, tp = {};
  (D.e || []).forEach(function (e) {
    var t = e[0], idx = e[2] * w + e[1];
    switch (t) {
      case 'P': start = idx; break;
      case 'L': C.leverAt[idx] = C.levers.length; C.levers.push({ i: idx, g: e[3] }); break;
      case 'p': C.plateAt[idx] = C.plates.length; C.plates.push({ i: idx, g: e[3] }); break;
      case 'G': C.gateAt[idx] = C.gates.length; C.gates.push({ i: idx, g: e[3], inv: e[4] | 0 }); break;
      case 'D': C.doorAt[idx] = C.doors.length; C.doors.push({ i: idx, k: e[3] }); break;
      case 'K': C.pickAt[idx] = C.picks.length; C.picks.push({ i: idx, key: 1, k: e[3] }); break;
      case 'I': C.pickAt[idx] = C.picks.length; C.picks.push({ i: idx, key: 0, k: e[3] }); break;
      case 'C': crates.push(idx); break;
      case 'S': C.spikeAt[idx] = C.spikes.length; C.spikes.push({ i: idx, g: e[3], inv: e[4] | 0 }); break;
      case 'Z': C.laserAt[idx] = C.lasers.length; C.lasers.push({ i: idx, d: e[3], g: e[4], inv: e[5] | 0 }); break;
      case 'X': C.killAt[idx] = C.kills.length; C.kills.push({ i: idx, k: e[3] }); break;
      case 'Q': C.poolAt[idx] = 1; C.pools.push(idx); break;
      case 'E': C.wireAt[idx] = 1; C.wires.push(idx); break;

/* ---------- подсказки ---------- */
var hw = null, hid = 0, hq = {};
function makeWorker() {
  // однофайловая сборка: правила встроены в страницу — собираем воркер из них
  var src = document.getElementById('logicjs');
  if (src && window.Blob && window.URL) {
    var code = src.textContent + '\nself.onmessage=function(m){var C=self.L.compile(m.data.D),r=self.L.solve(C,m.data.s,m.data.lim||400000);self.postMessage({id:m.data.id,ok:r.ok,over:!!r.over,sol:r.sol||null});};';
    return new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  }
  return new Worker('js/hint.js');
}
/* решатель в фоне: cb({ ok, over, sol }); если воркера нет — считаем тут же */
function solveLocal(q) { var r = L.solve(L.compile(q.D), q.s, Math.min(q.lim, 150000)); q.cb({ ok: r.ok, over: !!r.over, sol: r.sol || null }); }
function solveAsync(s, lim, cb) {
  var my = ++hid, q = { D: LV[cur], s: s, lim: lim, cb: cb };
  hq[my] = q;
  try {
    if (!hw) {
      hw = makeWorker();
      hw.onmessage = function (m) { var p = hq[m.data.id]; if (p) { delete hq[m.data.id]; p.cb(m.data); } };
      hw.onerror = function () { hw = null; var ids = Object.keys(hq); ids.forEach(function (i) { var p = hq[i]; delete hq[i]; solveLocal(p); }); };
    }
    hw.postMessage({ id: my, D: q.D, s: s, lim: lim });
  } catch (e) { hw = null; delete hq[my]; solveLocal(q); }
}
function showHint() {
  if (!hintSeq || !hintSeq.length) { hintSeq = null; SCN.setHint(null); return; }
  var s = st, cells = [], wait = false;
  for (var k = 0; k < Math.min(4, hintSeq.length); k++) {
    var a = hintSeq[k];
    if (a === 4) { if (k === 0) wait = true; break; }
    cells.push({ c: s.p, d: a });
    var r = L.step(C, s, a); if (r.s.dead) break; s = r.s;
  }
  SCN.setHint({ cells: cells, wait: wait });
}

      if (!r.ok) { toast(r.over ? 'Слишком запутано отсюда. Начни заново ⟲' : 'Тупик! Отмени ход ↶ или начни заново'); return; }

  modal('<div class="ico">💡</div><h2>Подсказка</h2><p>Покажу путь к смерти. Подсказки закончились — выбери способ:</p>' +

      var i = +b.getAttribute('data-b'), s = MD.SKINS[i];
      if (save.own.indexOf(i) < 0) { if (!pay(s)) return; save.own.push(i); }
      save.skin = i; SCN.setSkin(i); persist(true); checkAch(); openShop('sk'); updCoins();
    };
  });
  qa('[data-pl]', $('card')).forEach(function (b) {
    b.onclick = function () {
      AU.init(); AU.resume(); var id = b.getAttribute('data-pl'), m = trackMu(id === 'auto' ? null : id, musW);
      AU.play(m.mu, m.seed); previewing = true; toast('♪ Слушаем...');
    };
  });
  qa('[data-m]', $('card')).forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-m'), t = TX.TRACKS.filter(function (x) { return x.id === id; })[0];
      if (t && save.ownT.indexOf(id) < 0) { if (!pay(t)) return; save.ownT.push(id); }
      save.track = id; previewing = false; persist(true); playMusic(); openShop('mu'); updCoins();
    };
  });
  qa('[data-x]', $('card')).forEach(function (b) {
    b.onclick = function () {
      var x = b.getAttribute('data-x');
      if (x === 'h3') { if (!pay({ p: 60 })) return; save.hints += 3; persist(); openShop('bn'); }
      if (x === 'hg') { if (!pay({ g: 2 })) return; save.hints += 6; persist(); openShop('bn'); }
      if (x === 'cg') { if (!pay({ g: 5 })) return; save.coins += 400; persist(); openShop('bn'); }
      if (x === 'ad') adReward(function () { save.coins += 60; persist(); updCoins(); AU.fx('coin'); openShop('bn'); });
      if (x === 'ag') adReward(function () { save.gems += 2; persist(); updCoins(); AU.fx('coin'); toast('+2 💎'); openShop('bn'); });
      if (x === 'ah') adReward(function () { save.hints += 1; persist(); openShop('bn'); });
      updCoins(); if (C && scr === 'hud') updHud();
    };
  });
  bind('shX', function () { closeModal(); if (previewing) { previewing = false; playMusic(); } });
}
/* ---------- награды ---------- */
var ACH = [
  { id: 'd1', n: 'Первая смерть', d: 'Пройди 1 уровень', e: '☠️', f: function () { return save.lvl >= 1; }, c: 20 },
  { id: 'd10', n: 'Входит во вкус', d: 'Пройди 10 уровней', e: '🔥', f: function () { return save.lvl >= 10; }, c: 50 },
  { id: 'd50', n: 'Турист', d: 'Пройди первый мир', e: '🧳', f: function () { return save.lvl >= 50; }, c: 100, g: 3 },
  { id: 'd100', n: 'Сотня', d: 'Пройди 100 уровней', e: '💯', f: function () { return save.lvl >= 100; }, c: 150, g: 5 },
  { id: 'd250', n: 'Четверть тысячи', d: 'Пройди 250 уровней', e: '🎖️', f: function () { return save.lvl >= 250; }, c: 250, g: 5 },
  { id: 'd500', n: 'Полпути на тот свет', d: 'Пройди 500 уровней', e: '🌗', f: function () { return save.lvl >= 500; }, c: 400, g: 8 },
  { id: 'd750', n: 'Почти бессмертный', d: 'Пройди 750 уровней', e: '🦴', f: function () { return save.lvl >= 750; }, c: 500, g: 8 },
  { id: 'd1000', n: '1000 способов', d: 'Пройди все уровни', e: '👑', f: function () { return save.lvl >= N; }, c: 1000, g: 20 },
  { id: 's100', n: 'Звездочёт', d: 'Собери 100 звёзд', e: '⭐', f: function () { return totalStars() >= 100; }, c: 100 },
  { id: 's500', n: 'Созвездие', d: 'Собери 500 звёзд', e: '🌟', f: function () { return totalStars() >= 500; }, c: 300, g: 5 },
  { id: 's1500', n: 'Галактика', d: 'Собери 1500 звёзд', e: '🌌', f: function () { return totalStars() >= 1500; }, c: 600, g: 10 },
  { id: 'r25', n: 'Упрямец', d: 'Найди 25 отказов смерти', e: '🛡️', f: function () { return save.st.refs >= 25; }, c: 60 },
  { id: 'r200', n: 'Коллекционер отказов', d: 'Найди 200 отказов смерти', e: '📚', f: function () { return save.st.refs >= 200; }, c: 200, g: 3 },
  { id: 'c10', n: 'Энциклопедия смертей', d: 'Умри всеми 10 способами', e: '📖', f: function () { return Object.keys(save.causes).length >= 10; }, c: 300, g: 5 },
  { id: 'sk', n: 'Модник', d: 'Купи скин', e: '🎭', f: function () { return save.own.length > 1; }, c: 30 },
  { id: 'sk6', n: 'Гардероб', d: 'Собери 6 скинов', e: '👔', f: function () { return save.own.length >= 6; }, c: 200, g: 3 },
  { id: 'un', n: 'Машина времени', d: 'Отмени 100 ходов', e: '⏪', f: function () { return save.st.undo >= 100; }, c: 50 },
  { id: 'mv', n: 'Марафонец', d: 'Сделай 5000 ходов', e: '👟', f: function () { return save.st.moves >= 5000; }, c: 150 },
  { id: 'w50', n: 'Коллекционер', d: 'Найди 50 способов умереть', e: '📖', f: function () { return waysFound() >= 50; }, c: 100, g: 2 },
  { id: 'ws5', n: 'Секретный агент', d: 'Найди 5 секретных способов', e: '🤫', f: function () { return secretFound() >= 5; }, c: 150, g: 3 },
  { id: 'w300', n: 'Библиотекарь', d: 'Найди 300 способов умереть', e: '📚', f: function () { return waysFound() >= 300; }, c: 300, g: 5 }
];
function checkAch() {
  ACH.forEach(function (a) {
    if (!save.ach[a.id] && a.f()) { save.ach[a.id] = 1; save.coins += a.c; save.gems += a.g || 0; setTimeout(function () { toast(a.e + ' ' + a.n + ' +' + a.c + ' 🪙' + (a.g ? ' +' + a.g + ' 💎' : '')); AU.fx('coin'); }, 600); persist(); updCoins(); }
  });
}
function openAch() {
  var n = 0, h = '<h2>Награды</h2><div class="ach">';
  ACH.forEach(function (a) { if (save.ach[a.id]) n++; h += '<div class="' + (save.ach[a.id] ? 'on' : '') + '"><span>' + a.e + '</span><p><b>' + a.n + '</b><small>' + a.d + ' · +' + a.c + ' 🪙' + (a.g ? ' +' + a.g + ' 💎' : '') + '</small></p></div>'; });
  h += '</div><div class="pb"><i style="width:' + n / ACH.length * 100 + '%"></i></div><p class="m">Получено ' + n + ' из ' + ACH.length + '</p><button class="btn" id="aX">Закрыть</button>';
  modal(h); bind('aX', closeModal);
}

/* ---------- ежедневный подарок ---------- */
function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function giftReady() { return save.daily !== today(); }
function openGift() {
  if (!giftReady()) { modal('<div class="ico">🎁</div><h2>Подарок получен</h2><p>Приходи завтра — будет ещё. Серия: ' + save.streak + ' дн.</p><button class="btn" id="gX">Ок</button>'); bind('gX', closeModal); return; }
  var y = new Date(Date.now() - 864e5), ys = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  var streak = save.daily === ys ? save.streak + 1 : 1, amt = Math.min(150, 40 + streak * 15), gm = streak >= 7 ? 3 : streak >= 5 ? 2 : streak >= 3 ? 1 : 0;
  modal('<div class="ico">🎁</div><h2>Ежедневный подарок</h2><p>День ' + streak + ' подряд' + (gm ? '' : ' · с 3-го дня — 💎') + '</p><div class="reward">+' + amt + ' 🪙 и 💡' + (gm ? ' и ' + gm + ' 💎' : '') + '</div><div class="btns"><button class="btn g" id="gTake">Забрать</button><button class="btn p" id="gX2">📺 ×2 за рекламу</button></div>');
  var take = function (k) { save.daily = today(); save.streak = streak; save.coins += amt * k; save.gems += gm * k; save.hints += 1; persist(true); updCoins(); closeModal(); AU.fx('coin'); toast('+' + amt * k + ' 🪙  +1 💡' + (gm ? '  +' + gm * k + ' 💎' : '')); $('mGift').classList.remove('y'); openMenu(); };
  bind('gTake', function () { take(1); });
  bind('gX2', function () { adReward(function () { take(2); }); });
}

/* ---------- раскладка ---------- */
function layout() {
  var W = innerWidth, H = innerHeight, port = H > W * 1.05;
  $('dpad').classList.toggle('on', dpadOn() && scr === 'hud');
  var hb = $('hud').querySelector('.hbot');
  if (port && dpadOn()) hb.style.cssText = 'display:grid;grid-template-columns:repeat(2,66px);right:10px;left:auto;transform:none';
  else if (port) hb.style.cssText = 'display:flex;left:50%;right:auto;transform:translateX(-50%)';
  else hb.style.cssText = 'display:flex;right:10px;left:auto;transform:none';
  if (scr === 'menu') { SCN.setPads(port ? H * 0.32 : H * 0.34, port ? H * 0.42 : H * 0.2, port ? 10 : W * 0.2); return; }
  // подсказка о механике: в портрете — по центру экрана, в узкой альбомной — правее колонки счётчиков
  var idea = $('hIdea'); idea.style.left = ''; idea.style.maxWidth = '';
  if (!port && W < 1100) { var ix0 = 250, ix1 = W - 10; idea.style.left = Math.round((ix0 + ix1) / 2) + 'px'; idea.style.maxWidth = (ix1 - ix0) + 'px'; }
  // счётчик ходов — под заданием и подсказкой, даже если они переносятся на несколько строк
  var hs = $('hud').querySelector('.hstats'), ib = 0; hs.style.top = '';
  ['hGoal', 'hIdea'].forEach(function (id) { var r = $(id).getBoundingClientRect(); if (r.height && r.left < 250) ib = Math.max(ib, r.bottom + 6); });
  if (ib > hs.getBoundingClientRect().top) hs.style.top = Math.round(ib) + 'px';
  var top = port ? 118 : 92, bot = port ? (dpadOn() ? 200 : 96) : 20, side = port ? 8 : (dpadOn() ? Math.min(W * 0.24, 190) : Math.min(W * 0.12, 90));
  SCN.setPads(top, bot, side);
}
addEventListener('resize', function () { setTimeout(layout, 50); });

/* ---------- ввод ---------- */
var KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3, Space: 4, Enter: 4, Period: 4 };
addEventListener('keydown', function (e) {
  if (frozen()) { if (e.code in KEYS) e.preventDefault(); return; }
  if (e.code in KEYS) { e.preventDefault(); if (scr === 'hud') act(KEYS[e.code]); }
  else if (e.code === 'KeyZ' || e.code === 'Backspace') { e.preventDefault(); undo(); }
  else if (e.code === 'KeyR') restart();
  else if (e.code === 'KeyH') askHint();
  else if (e.code === 'Escape') { if (modalOn() && scr === 'hud' && !dead) closeModal(); else pause(); }
});
var ptr = null;
$('gl').addEventListener('pointerdown', function (e) { ptr = { x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId }; AU.init(); AU.resume(); });
$('gl').addEventListener('pointerup', function (e) {
  if (!ptr || e.pointerId !== ptr.id || scr !== 'hud') { ptr = null; return; }
  var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, d = Math.hypot(dx, dy);
  if (d > 22) act(SCN.dirFromVec(dx, dy));
  else if (Date.now() - ptr.t < 400) {
    var c = SCN.cellAt(e.clientX, e.clientY), p = st.p;
    if (c === p) act(4);
    else if (c >= 0) {
      for (var k = 0; k < 4; k++) if (L.nb(C, p, k) === c) { act(k); break; }
      if (k === 4) {
        var wp = !dead && !modalOn() ? walkPath(c) : null;
        if (wp && wp.length) { walkQ = wp; SCN.setMark(c); }
        else { var ps = SCN.playerScreen(); act(SCN.dirFromVec(e.clientX - ps[0], e.clientY - ps[1])); }
      }
    }
  }
  ptr = null;
});
qa('.dp').forEach(function (b) {
  var rep = null;
  b.addEventListener('pointerdown', function (e) { e.preventDefault(); AU.init(); var d = +b.getAttribute('data-d'); act(d); clearInterval(rep); rep = setInterval(function () { act(d); }, 210); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { b.addEventListener(n, function () { clearInterval(rep); }); });
});
bind('hUndo', undo); bind('hWait', function () { act(4); }); bind('hRestart', restart); bind('hHint', askHint); bind('hPause', pause);
$('hGoal').addEventListener('pointerdown', function () { if ($('hIdea').textContent) $('hIdea').classList.toggle('on'); });
bind('hDead', undo);
bind('mPlay', function () { AU.init(); startLevel(Math.min(save.lvl, N - 1)); });
bind('mLevels', function () { AU.init(); openWorlds(); });
bind('mShop', function () { AU.init(); openShop('sk'); });
bind('mAch', function () { AU.init(); openAch(); });
bind('mWays', function () { AU.init(); openWays(worldOf(Math.min(save.lvl, N - 1))); });
bind('mGift', function () { AU.init(); openGift(); });
bind('mSet', function () {
  modal('<h2>Настройки</h2>' + settingsHtml() + (YA.settingsHtml ? YA.settingsHtml() : '') + '<p class="m">Прогресс сохраняется автоматически.<br>Пройдено: ' + save.lvl + ' из ' + N + ' · смертей: ' + save.st.deaths + ' · отказов смерти: ' + save.st.refs + '</p><button class="btn" id="stX">Готово</button>');
  bindSettings(); bind('stX', closeModal);
  if (YA.bindSettings) YA.bindSettings(bind);
});
/* звук можно запустить только после первого касания */
['pointerdown', 'keydown', 'touchstart'].forEach(function (n) { document.addEventListener(n, function () { AU.init(); AU.resume(); }, { capture: true, passive: true }); });
qa('[data-back]').forEach(function (b) { b.onclick = function () { AU.fx('ui'); var t = b.getAttribute('data-back'); if (t === 'menu') openMenu(); else openWorlds(); }; });
$('modal').addEventListener('pointerdown', function (e) { if (e.target === $('modal') && scr !== 'hud') closeModal(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });

/* пауза: вкладка скрыта, платформа просит паузу (реклама, окно покупки) — игра стоит, звука нет;
   окно потеряло фокус — звук выключается, «Бегом!» не тикает */
var hidden = false, blurred = false, ppause = false;
function frozen() { return hidden || ppause || adOpen; }
function applyMute() { AU.setMuted(frozen() || blurred); }
function thaw() { rtT = performance.now(); }
function canPlay() { return scr === 'hud' && !modalOn() && !dead && !frozen(); }
document.addEventListener('visibilitychange', function () {
  hidden = document.hidden; applyMute();
  if (hidden) YA.flush(); else thaw();
  // если платформа не присылает паузу сама — размечаем геймплей вручную
  if (!YA.auto) { if (hidden) YA.stop(); else if (canPlay()) YA.start(); }
});
addEventListener('pagehide', function () { YA.flush(); });
addEventListener('blur', function () { blurred = true; applyMute(); });
addEventListener('focus', function () { if (!blurred) return; blurred = false; applyMute(); thaw(); });
YA.onPause(function () { ppause = true; applyMute(); }, function () { ppause = false; applyMute(); thaw(); });

/* ---------- цикл ---------- */
var last = 0;
var ov = $('ov'), ovc = ov.getContext('2d');
var manual = false; // кадры гонит запись ролика (tools/rec.js), а не браузер
function loop(ts) { requestAnimationFrame(loop); if (!manual) tick(ts); }
function tick(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (frozen()) return;
  if (scr === 'hud' || scr === 'menu' || scr === 'worlds' || scr === 'levels') {
    if (!SCN.busy() && !dead && scr === 'hud' && !modalOn()) {
      if (queue.length) act(queue.shift());
      else if (walkQ.length) { act(walkQ.shift(), true); if (!walkQ.length) SCN.setMark(-1); }
      else if (isRt() && !blurred && performance.now() - rtT > RT_MS) act(4, true, true);
    }
    SCN.frame(dt);
    var dpr = Math.min(window.devicePixelRatio || 1, window.__dprMax || 2), w = Math.round(ov.clientWidth * dpr), h = Math.round(ov.clientHeight * dpr);
    if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
    if (scr === 'hud') SCN.overlay(ovc); else ovc.clearRect(0, 0, ov.width, ov.height);
  }
}

/* ---------- запуск ---------- */
function boot() {
  if (!R3.init($('gl'))) {
    $('loading').innerHTML = '<div class="card"><h2>Нужен WebGL</h2><p>Похоже, браузер не поддерживает 3D-графику. Попробуй обновить его или включить аппаратное ускорение.</p></div>';
    YA.init(function () { YA.ready(); }); return;
  }
  loadLocal();
  // облачное сохранение пришло позже или игрок выбрал другой прогресс после входа в аккаунт
  YA.onCloud(function (d, force) {
    if (force) save = JSON.parse(JSON.stringify(DEF));
    merge(d);
    try { localStorage.setItem('d1000v2', JSON.stringify(save)); } catch (e) { }
    AU.setMusicVol(save.set.mv); AU.setSfxVol(save.set.sv); updCoins();
    if (scr === 'menu' || force) { closeModal(); openMenu(); }
  });
  YA.init(function (cloud) {
    if (cloud) merge(cloud);
    AU.setMusicVol(save.set.mv); AU.setSfxVol(save.set.sv);
    openMenu();
    YA.ready();
    requestAnimationFrame(loop);
    if (giftReady() && save.lvl > 0) setTimeout(openGift, 600);
  });
}
boot();
G.GAME = { tick: tick, manual: function (m) { manual = !!m; last = performance.now(); }, start: startLevel, act: act, st: function () { return st; }, save: function () { return save; }, menu: openMenu, walkQ: function () { return walkQ; }, ways: openWays };
})(window);

</script>
